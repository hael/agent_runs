# arun run: @RUN@. Sourced by arun on the controlling machine and by the driver on the remote machine.
# HOST and LOCAL_REPO come from arun.conf; set them here only when this run differs.
#HOST=                                      # ssh host of the remote machine
#LOCAL_REPO=~/src/SIMPLE                    # the checkout copied at launch
REMOTE_ROOT=agent_runs/@RUN@                # run directory there, relative to its home

# The plan the run carries out, inside the repository, and where it ends up when done.
PLAN=doc/refactoring_notes/planned/@RUN@.md
PLAN_DONE=doc/refactoring_notes/completed/@RUN@.md
# Heading of the plan's file table: first column the files, last column the phases that
# may edit them ("each" for all). The fence lets a phase edit only those files.
ALLOW_TABLE="### File disposition"
PHASES="0 1 2 3"                            # in order

# The project. The base prompt, the fence, the preflight and arun status read these.
PROJECT=SIMPLE                       # named in the base prompt
MAINTAINER="Hans Elmlund"            # who delegated the run and reviews the diff
PATH_BASE=src/main/                  # bare paths in the file table live here (empty: the repository root)
COMPANION=".f90:_tester"             # a listed x.f90 also allows x_tester.f90 (empty: none)
COPY_EXCLUDES="/build/ /build_*/ node_modules/"   # left out when arun copies the checkout
TOOLS="gfortran gcc cmake make"      # recorded by the preflight
CHECKOUT_MARKER=compile_debug.sh     # the preflight lists other checkouts holding this file
JOB_PATTERN="simple_|ctest|make|cmake|gfortran|/usr/bin/time"   # the jobs arun status lists

CONTINUE_SESSION=1          # a phase continues the previous phase's session (0: fresh each time)
FAST_MODE=1                 # faster output at a higher token price (subscription or API key only)
PHASE_MAX_TURNS=3000        # per session
PHASE_TIMEOUT=48h           # wall clock per session
MODEL=                      # empty: the account's default model
BUDGET_USD=                 # per session; empty: no cap
DISK_MIN_GB=20              # below this, sessions may only inspect and clean up
CLEANUP=1                   # after a DONE phase, delete bulky non-text files in scratch/
